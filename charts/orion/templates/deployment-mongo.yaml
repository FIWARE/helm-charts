{{- if .Values.mongo.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "orion.fullname" . }}-mongo
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    app.kubernetes.io/name: {{ include "orion.name" . }}-mongo
    helm.sh/chart: {{ include "orion.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  # A single standalone instance without persistence, multiple replicas would be independent databases
  replicas: 1
  revisionHistoryLimit: {{ .Values.deployment.revisionHistoryLimit }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "orion.name" . }}-mongo
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "orion.name" . }}-mongo
        helm.sh/chart: {{ include "orion.chart" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/managed-by: {{ .Release.Service }}
        {{- with .Values.deployment.additionalLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{ if .Values.deployment.additionalAnnotations -}}
      annotations:
        {{- with .Values.deployment.additionalAnnotations }}
          {{- toYaml . | nindent 8 }}
          {{- end }}
      {{- end }}
    spec:
      containers:
        - name: mongo-db
          imagePullPolicy: {{ .Values.mongo.image.pullPolicy }}
          image: "{{ .Values.mongo.image.repository }}:{{ .Values.mongo.image.tag }}"
          securityContext:
            runAsUser: 999
          args: ["--port", "{{ .Values.mongo.port }}"]
          ports:
            - name: mongo
              containerPort: {{ .Values.mongo.port}}
              protocol: TCP
          livenessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - 'db.runCommand("ping").ok'
                - mongodb://127.0.0.1:{{ .Values.mongo.port }}/test
            initialDelaySeconds: 5
            periodSeconds: 5
          readinessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - 'db.runCommand("ping").ok'
                - mongodb://127.0.0.1:{{ .Values.mongo.port }}/test
            initialDelaySeconds: 5
            periodSeconds: 5
{{- end }}
