{{- if not .Values.secrets.existingSecret }}
{{- /*
logPseudonymKey and erasureVerificationSecret must never rotate. The configured value wins; else
the live Secret's value is reused through `lookup`, else one is generated. `lookup` is empty under
helm template, --dry-run, Argo CD and Flux, so there the fallback rotates on every render.
resource-policy keep stops an uninstall from deleting the keys with the Secret.
*/}}
{{- $s := .Values.secrets }}
{{- $name := include "dscConsentManager.secretName" . }}
{{- $existingData := (lookup "v1" "Secret" $.Release.Namespace $name).data | default dict }}
{{- $keyBytes := include "dscConsentManager.generatedKeyBytes" . | int }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    {{- include "dscConsentManager.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  DB_USER: {{ $s.dbUser | b64enc | quote }}
  DB_PASSWORD: {{ $s.dbPassword | b64enc | quote }}
  LOG_PSEUDONYM_KEY: {{ $s.logPseudonymKey | b64enc | default (get $existingData "LOG_PSEUDONYM_KEY") | default (randBytes $keyBytes | b64enc) | quote }}
  ERASURE_VERIFICATION_SECRET: {{ $s.erasureVerificationSecret | b64enc | default (get $existingData "ERASURE_VERIFICATION_SECRET") | default (randBytes $keyBytes | b64enc) | quote }}
  {{- with $s.smtpUser }}
  SMTP_USER: {{ . | b64enc | quote }}
  {{- end }}
  {{- with $s.smtpPassword }}
  SMTP_PASSWORD: {{ . | b64enc | quote }}
  {{- end }}
{{- end }}
