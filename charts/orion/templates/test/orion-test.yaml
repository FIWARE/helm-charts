{{- if .Values.test.enabled -}}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ .Release.Name }}-orion-test"
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    {{ include "orion.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: curl
      image: "{{ .Values.test.image.repository }}:{{ .Values.test.image.tag }}"
      args: [ "--fail", "--silent", "--show-error", "http://{{ include "orion.fullname" . }}.{{ .Release.Namespace }}:{{ .Values.service.port }}/version" ]
  restartPolicy: Never
{{- end }}
