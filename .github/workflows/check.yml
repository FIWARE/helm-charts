name: Chart Test
env:
  HELM_VERSION: "4.0.4"
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
    branches:
      - main

# One run per pull request: opening a pull request with a label fires `opened` and `labeled` at the same
# time. A newer run cancels the one in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:

  # lint the charts
  lint:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - uses: azure/setup-helm@v4
        with:
          version: '${{ env.HELM_VERSION }}'

      - name: Update charts dependencies
        run: ./build.sh

      - name: Lint
        run: ./lint.sh

  eval:

    runs-on: ubuntu-latest
    needs:
      - lint

    steps:
      - uses: actions/checkout@v2

      - uses: azure/setup-helm@v4
        with:
          version: '${{ env.HELM_VERSION }}'

      - name: Update charts dependencies
        run: ./build.sh

      - name: Eval
        run: |
          .github/build/install-kubeconform.sh
          ./eval.sh

  # Render the `common` library chart's fixture consumer and diff the
  # output against the committed golden files under
  # charts/common/tests/expected/. Any drift in a `common.*` helper —
  # intended or accidental — is caught here before it can propagate to
  # the per-chart migrations. See scripts/test-common.sh for details.
  common-tests:

    runs-on: ubuntu-latest
    needs:
      - lint

    steps:
      - uses: actions/checkout@v2

      - uses: azure/setup-helm@v4
        with:
          version: '${{ env.HELM_VERSION }}'

      - name: Render fixture and diff against golden files
        run: bash scripts/test-common.sh

  # Requires a semver label and bumps the version of every changed chart from its version on the
  # base branch, then regenerates the documentation. Bumping from the base branch makes the result the
  # same however often it runs, also on the pull requests of the appVersion bot, which bump the
  # version themselves. See https://github.com/FIWARE/github-workflows
  chart-version:
    needs:
      - lint
      - eval
      - common-tests
    uses: FIWARE/github-workflows/.github/workflows/chart-pr.yml@v1
    permissions:
      contents: write
      pull-requests: write
    with:
      helm-docs-version: v1.14.2
