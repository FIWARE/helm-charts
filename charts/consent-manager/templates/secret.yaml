{{- if include "consentManager.createSecret" . }}
{{/*
The session / JWT / OAuth secrets and the consent key.

The three secrets are generated on first install and then KEPT: `lookup` returns
the live values on an upgrade, so a redeploy does not invalidate existing
sessions and issued tokens. `helm.sh/resource-policy: keep` protects them from an
uninstall as well - losing them means every session and token becomes
unverifiable. The consent key is never generated: the gateway in front injects
that exact value, so both sides have to be configured with it.
*/}}
{{- $existing := (lookup "v1" "Secret" $.Release.Namespace (include "consentManager.secretName" .)) | default dict }}
{{- $existingData := $existing.data | default dict }}
{{- $keys := .Values.secret.keys }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "consentManager.secretName" . }}
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    {{- include "consentManager.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ $keys.sessionSecret }}: {{ .Values.secret.sessionSecret | b64enc | default (index $existingData $keys.sessionSecret) | default (randAlphaNum 32 | b64enc) | quote }}
  {{ $keys.jwtSecret }}: {{ .Values.secret.jwtSecret | b64enc | default (index $existingData $keys.jwtSecret) | default (randAlphaNum 32 | b64enc) | quote }}
  {{ $keys.oauthSecret }}: {{ .Values.secret.oauthSecret | b64enc | default (index $existingData $keys.oauthSecret) | default (randAlphaNum 32 | b64enc) | quote }}
  {{- /* Not random by design when supplied: the gateway in front injects this exact value
         and the consent-manager validates it, so both sides must be configured with it.
         When it is NOT supplied the chart generates one anyway - that fails closed (no
         caller can present a matching key) rather than deploying a blank shared secret. */}}
  {{ $keys.consentKey }}: {{ .Values.secret.consentKey | b64enc | default (index $existingData $keys.consentKey) | default (randAlphaNum 32 | b64enc) | quote }}
{{- end }}
