{{- if .Values.serviceMonitor.enabled }}
# No credentials: metrics authentication is off and the management Service is ClusterIP, so the
# scrape never leaves the cluster.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "dscConsentManager.fullname" . }}
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    {{- include "dscConsentManager.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "dscConsentManager.managementSelectorLabels" . | nindent 6 }}
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: management
      path: {{ include "dscConsentManager.metricsPath" . }}
      scheme: http
      interval: {{ .Values.serviceMonitor.interval }}
      {{- with .Values.serviceMonitor.scrapeTimeout }}
      scrapeTimeout: {{ . }}
      {{- end }}
{{- end }}
