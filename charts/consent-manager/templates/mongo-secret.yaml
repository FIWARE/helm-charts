{{- if and (not .Values.mongo.uri) .Values.mongo.auth.password (not .Values.mongo.auth.existingSecret.name) }}
{{/*
The MongoDB password, when it is given as a value rather than taken from an
existing secret (which is the usual case - a managed MongoDB creates one for the
user it provisions).
*/}}
{{- include "fiwareCommon.secret.tpl" (dict
      "context"        $
      "existingSecret" .Values.mongo.auth.existingSecret
      "suffix"         "-mongo"
      "data"           (dict "password" .Values.mongo.auth.password)) }}
{{- end }}
