{{/*
Chart-local ConfigMap (server.yaml configuration payload): intentionally
not migrated. This ConfigMap renders the chart-specific verifier
configuration (server, m2m, logging, verifier, configRepo, elsi blocks)
and is not part of the common helper surface. See
charts/vcverifier/CHANGELOG.md for details.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vcverifier.fullname" . }}
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    {{- include "vcverifier.labels" . | nindent 4 }}
data:
  server.yaml: |-
    server:
      {{- $metricsPort := include "vcverifier.separateMetricsPort" . }}
      {{- with .Values.deployment.server }}
      {{- /* the verifier only gets metricsPort when it is a separate port: on the main port it would try to bind it twice */}}
      {{- $server := omit . "metricsPort" }}
      {{- if $metricsPort }}
      {{- $_ := set $server "metricsPort" (atoi $metricsPort) }}
      {{- end }}
      {{- toYaml $server | nindent 6 }}
      {{- end }}

    m2m:
      {{- with .Values.deployment.m2m }}
      {{- toYaml . | nindent 6 }}
      {{- end }}

    logging:
      {{- with .Values.deployment.logging }}
      {{- toYaml . | nindent 6 }}
      {{- end }}

    verifier:
      {{- with .Values.deployment.verifier }}
      {{- $verifier := omit . "refreshToken" }}
      {{- if .refreshToken }}
      {{- $_ := set $verifier "refreshToken" (omit .refreshToken "saltSecret") }}
      {{- end }}
      {{- toYaml $verifier | nindent 6 }}
      {{- end }}

    configRepo:
      {{- with .Values.deployment.configRepo }}
      {{- toYaml . | nindent 6 }}
      {{- end }}

    elsi:
      {{- with .Values.deployment.elsi }}
      {{- toYaml . | nindent 6 }}
      {{- end }}

    {{- if .Values.deployment.database }}
    database:
      {{- toYaml (omit .Values.deployment.database "existingSecret") | nindent 6 }}
    {{- end }}

    {{- if .Values.deployment.configServer }}
    configServer:
      {{- with .Values.deployment.configServer }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
    {{- end }}

    {{- if .Values.deployment.eidas }}
    eidas:
      {{- with .Values.deployment.eidas }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
    {{- end }}