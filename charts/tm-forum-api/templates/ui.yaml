{{- if .Values.ui.enabled -}}
{{- include "tmforum.ui.validate" . -}}
{{- if not .Values.allInOne.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tmforum.fullname" . }}-ui
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "tmforum.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.ui.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "tmforum.name" . }}-ui
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "tmforum.name" . }}-ui
        app.kubernetes.io/instance: {{ .Release.Name }}
        {{- include "tmforum.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "tmforum.serviceAccountName" . }}
      containers:
        {{- include "tmforum.ui.container" . | nindent 8 }}
      {{- with .Values.ui.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tmforum.fullname" . }}-ui
  namespace: {{ .Release.Namespace | quote }}
  {{- with .Values.ui.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "tmforum.labels" . | nindent 4 }}
spec:
  type: {{ .Values.ui.service.type }}
  ports:
    - port: {{ .Values.ui.service.port }}
      targetPort: http-ui
      protocol: TCP
      name: http
  selector:
    {{- if .Values.allInOne.enabled }}
    app.kubernetes.io/name: {{ include "tmforum.name" . }}-all-in-one
    {{- else }}
    app.kubernetes.io/name: {{ include "tmforum.name" . }}-ui
    {{- end }}
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
